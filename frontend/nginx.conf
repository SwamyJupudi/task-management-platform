# The static server inside the frontend image.
#
# It serves the built single-page application and nothing else. It does not
# terminate TLS, it does not proxy the API, and it sets no Content-Security-
# Policy. All three belong to the edge proxy in deploy/nginx/, and the reason is
# the same for each: they depend on the deployment's hostname, its certificate
# and its object-storage origin, none of which an image built in CI can know.
#
# What that leaves here is the part that is genuinely a property of these files:
# the SPA history fallback, the cache policy the build's own hashing earns, and
# the three response headers that are true regardless of where this runs.
#
# The whole file replaces the image's default nginx.conf rather than dropping a
# server block into conf.d, because the master process must be able to run as a
# non-root user and that needs the pid file and every temporary path moved out
# of directories only root can write.

worker_processes  auto;

# Not /var/run/nginx.pid: an unprivileged user cannot write there, and the
# container runs with a read-only root filesystem besides.
pid               /tmp/nginx.pid;

error_log         /dev/stderr warn;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Every scratch path under /tmp, which the container mounts as a tmpfs. With
    # a read-only root filesystem and no tmpfs, nginx fails to start rather than
    # failing on the first request, which is the better of the two.
    client_body_temp_path  /tmp/client_body;
    proxy_temp_path        /tmp/proxy;
    fastcgi_temp_path      /tmp/fastcgi;
    uwsgi_temp_path        /tmp/uwsgi;
    scgi_temp_path         /tmp/scgi;

    # One line per request, on stdout, so `docker logs` and the log collector
    # see it the same way they see the backend's JSON.
    access_log  /dev/stdout;

    sendfile        on;
    tcp_nopush      on;
    keepalive_timeout  65;

    # The version number off the Server header. It does not stop anybody, but
    # there is no reason to publish which nginx needs patching.
    server_tokens   off;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_types        text/plain text/css text/xml application/javascript application/json
                      image/svg+xml application/manifest+json;

    server {
        # 8080 rather than 80, because a process that is not root cannot bind a
        # privileged port. The edge proxy is what listens on 80 and 443.
        listen       8080;
        listen       [::]:8080;
        server_name  _;

        root   /usr/share/nginx/html;
        index  index.html;

        # The three headers that do not depend on the deployment. The Content-
        # Security-Policy deliberately is not here; see the note at the top.
        add_header  X-Content-Type-Options  "nosniff"      always;
        add_header  X-Frame-Options         "DENY"         always;
        add_header  Referrer-Policy         "no-referrer"  always;

        # The container health check, and the edge's upstream check. Answered
        # here rather than by falling through to index.html, so a 200 means
        # nginx is serving rather than that the SPA fallback caught it.
        location = /healthz {
            access_log  off;
            add_header  Content-Type  text/plain;
            return      200 "ok\n";
        }

        # Vite writes content-hashed filenames into assets/, so a given URL's
        # bytes never change: a new build produces a new name. That is what
        # makes `immutable` safe here and unsafe almost everywhere else.
        location /assets/ {
            # `expires` is deliberately not used beside this: it emits a
            # Cache-Control of its own, and the response would carry two of
            # them. One explicit header is unambiguous.
            add_header  Cache-Control  "public, max-age=31536000, immutable"  always;
            # add_header replaces the inherited set for this block, so the three
            # above are repeated rather than assumed.
            add_header  X-Content-Type-Options  "nosniff"      always;
            add_header  X-Frame-Options         "DENY"         always;
            add_header  Referrer-Policy         "no-referrer"  always;
            try_files   $uri =404;
        }

        # The document itself is never cached. It is the file that names the
        # current asset hashes, so a stale copy points a browser at the previous
        # deployment's bundle — which is how a deploy appears to have done
        # nothing until somebody hard-refreshes.
        location = /index.html {
            add_header  Cache-Control  "no-cache, must-revalidate"  always;
            add_header  X-Content-Type-Options  "nosniff"      always;
            add_header  X-Frame-Options         "DENY"         always;
            add_header  Referrer-Policy         "no-referrer"  always;
        }

        # The history fallback. React Router owns every path, so a deep link
        # such as /projects/<id> has no file behind it and must be answered with
        # the document rather than with a 404.
        location / {
            try_files  $uri $uri/ /index.html;
        }
    }
}
