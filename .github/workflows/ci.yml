name: CI

# Install -> lint -> test -> build -> image, for both halves of the repository.
#
# The delivery phase added the last stage. Images are built on every run so that
# a broken Dockerfile fails the pull request that broke it, and pushed to GHCR
# only from master, so a fork's pull request can never publish one.
#
# Deployment is NOT here. It lives in deploy.yml, which this workflow triggers on
# success, because a deploy needs an approval gate and a different set of
# permissions, and a job that can reach the production host should not sit in the
# workflow that pull requests run.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Two jobs rather than one, so they run in parallel and a failure names the
  # half that broke. Neither depends on the other: the frontend talks to the
  # backend over HTTP at runtime and not at build time.
  backend:
    name: Backend - lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # 17 because pom.xml sets <java.version>17</java.version>. Building on a
      # newer JDK would test something the project does not declare.
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      # Integration tests use Testcontainers and skip themselves when Docker is
      # missing. On CI that would turn a real gap into a silent pass, so the
      # runner is checked before anything else.
      - name: Verify Docker is available for Testcontainers
        run: docker info > /dev/null

      - name: Install dependencies
        run: ./mvnw -B -ntp dependency:go-offline

      - name: Lint
        run: ./mvnw -B -ntp spotless:check

      - name: Test and build
        run: ./mvnw -B -ntp verify

      - name: Confirm integration tests actually ran
        run: |
          if ! ls target/failsafe-reports/*.xml > /dev/null 2>&1; then
            echo "No integration test reports were produced." >&2
            exit 1
          fi
          if grep -l 'tests="0"' target/failsafe-reports/*.xml | grep -q .; then
            echo "Integration tests were skipped. Docker is likely unavailable." >&2
            exit 1
          fi

      - name: Upload build artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar
          retention-days: 7

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports/
            target/failsafe-reports/
          retention-days: 7

  frontend:
    name: Frontend - lint, typecheck, test and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # 22 because Vite 8 and oxlint both declare engines
      # "^20.19.0 || >=22.12.0", and 22 is the current LTS line.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          # setup-node resolves this from the repository root rather than from
          # the job's working-directory, so the path is spelled in full.
          cache-dependency-path: frontend/package-lock.json

      # `ci` rather than `install`: it installs exactly what package-lock.json
      # pins and fails if the two have drifted, which is what a pipeline wants.
      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The production build runs `tsc -b` itself, so this is not redundant by
      # accident: it fails the pipeline on a type error before a bundle is
      # attempted, which reads better than a build log that ends in tsc output.
      - name: Typecheck
        run: npx tsc -b --noEmit

      # `--run` because Vitest watches by default, which would hang a pipeline.
      # Placed before the build: a failing assertion is a clearer report than a
      # bundle that succeeds and tells you nothing.
      #
      # VITE_API_BASE_URL is set here for the same reason the build below sets
      # it: src/config/env.ts validates the environment at module load and
      # throws on a missing value, so importing anything that reaches it fails
      # the whole run. A developer's machine supplies it from .env.local, which
      # is git-ignored and therefore absent here — which is exactly why this
      # passed locally and failed in CI.
      - name: Test
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run test -- --run

      # VITE_API_BASE_URL is required at module load, and the build bakes it in.
      # The relative path is the deployed value too, not just the development
      # one: the interface and the API are served from a single origin, because
      # the refresh cookie is SameSite=Strict and would not be sent across two.
      # frontend/Dockerfile fixes the same value for the same reason.
      - name: Build
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

      - name: Upload the built interface
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Images
  #
  # Built on every run and pushed only from master. A pull request therefore
  # proves its Dockerfiles still build without being able to publish anything,
  # which matters because a pull request from a fork runs with a read-only token
  # and must stay that way.
  #
  # `needs` both halves on purpose. An image is only worth building from a
  # commit whose tests passed, and pushing one from a commit whose tests failed
  # would put a tag in the registry that nothing should ever deploy.
  # ---------------------------------------------------------------------------
  images:
    name: Images - build and push
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    permissions:
      contents: read
      # Only this job gets it, and only for the push below.
      packages: write

    strategy:
      # One matrix entry per image, so a failure names the image that broke and
      # the three build in parallel.
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            dockerfile: Dockerfile
          - name: frontend
            context: frontend
            dockerfile: frontend/Dockerfile
          - name: scan-gateway
            context: deploy/clamav
            dockerfile: deploy/clamav/Dockerfile

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Skipped entirely on a pull request. Logging in to a registry the run is
      # not going to push to is an avoidable use of a credential.
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          # The commit SHA is the tag a deployment names, so that what is running
          # is always traceable to a commit. `latest` is a convenience for
          # reading the registry and is never what the deploy job pulls.
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build${{ (github.event_name == 'push' && github.ref == 'refs/heads/master') && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GitHub's own cache, so a dependency layer survives between runs.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # ---------------------------------------------------------------------------
  # The deployment artifacts
  #
  # Cheap, and it catches the class of mistake that is otherwise found at deploy
  # time on the production host: a compose file that does not parse, or an nginx
  # configuration with a typo in it.
  # ---------------------------------------------------------------------------
  deployment-config:
    name: Deployment config - validate
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # Every required variable is given a throwaway value. The file uses the
      # ${VAR:?message} form for the ones a deployment must set, so this both
      # renders the file and proves those guards are wired up.
      - name: Validate the production compose file
        working-directory: deploy
        env:
          APP_SERVER_NAME: app.example.com
          APP_S3_ORIGIN: https://example-bucket.s3.eu-west-1.amazonaws.com
          BACKEND_IMAGE: ghcr.io/example/backend:validation
          FRONTEND_IMAGE: ghcr.io/example/frontend:validation
          SCAN_GATEWAY_IMAGE: ghcr.io/example/scan-gateway:validation
          REDIS_PASSWORD: validation-only
          DB_PASSWORD: validation-only
        run: |
          # env_file points at a file the deploy job writes on the host, so it
          # does not exist here. An empty one is enough to render the config.
          touch .env
          docker compose -f docker-compose.prod.yml config > /dev/null
          echo "docker-compose.prod.yml parses."

      # nginx cannot check a template, only a rendered configuration, so this
      # renders it exactly the way the image's entrypoint does and then asks
      # nginx. A throwaway self-signed certificate is generated first because
      # `nginx -t` opens the certificate files, and a missing one fails the test
      # for a reason that has nothing to do with the configuration.
      - name: Validate the edge proxy configuration
        run: |
          CERT_DIR="$RUNNER_TEMP/letsencrypt/live/app.example.com"
          mkdir -p "$CERT_DIR"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj "/CN=app.example.com" \
            -keyout "$CERT_DIR/privkey.pem" \
            -out "$CERT_DIR/fullchain.pem" 2>/dev/null
          cp "$CERT_DIR/fullchain.pem" "$CERT_DIR/chain.pem"

          docker run --rm \
            -e NGINX_ENVSUBST_FILTER='^APP_' \
            -e APP_SERVER_NAME=app.example.com \
            -e APP_S3_ORIGIN=https://example-bucket.s3.eu-west-1.amazonaws.com \
            -v "$PWD/deploy/nginx/templates:/etc/nginx/templates:ro" \
            -v "$RUNNER_TEMP/letsencrypt:/etc/letsencrypt:ro" \
            --entrypoint /bin/sh \
            nginx:1.27-alpine -c '/docker-entrypoint.sh nginx -t'
          echo "The edge proxy configuration is valid."

      # The frontend image ships a whole nginx.conf rather than a conf.d
      # fragment, so it is checked the same way and on its own.
      - name: Validate the frontend server configuration
        run: |
          docker run --rm \
            -v "$PWD/frontend/nginx.conf:/etc/nginx/nginx.conf:ro" \
            nginx:1.27-alpine nginx -t
          echo "The frontend server configuration is valid."
