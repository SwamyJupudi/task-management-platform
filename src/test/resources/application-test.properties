# Integration tests get their datasource from the PostgreSQL container via
# @ServiceConnection. These values only satisfy the placeholders in
# application.properties so the context can start; they are overridden.
spring.datasource.url=jdbc:postgresql://localhost:5432/placeholder
spring.datasource.username=placeholder
spring.datasource.password=placeholder

spring.flyway.clean-disabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN

# Fixed key so a token minted in one test can be read in another.
app.security.jwt.secret=test-only-signing-key-thirty-two-bytes-minimum
app.security.cookie.secure=false
app.mail.log-tokens=true

# Short enough that a lockout test does not have to wait, long enough that it
# does not expire mid-test.
app.security.lockout.max-attempts=5
app.security.lockout.duration=15m

# Attachments are written under the build directory, so the suite leaves
# nothing behind outside target/ and a clean build starts from empty.
app.storage.provider=LOCAL
app.storage.local-directory=./target/test-attachments
# Small enough that the oversize test does not have to build ten megabytes.
app.storage.max-file-size=1MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# The deadline scan is off here and driven directly by its own tests. A suite
# that raced a background job it did not start would fail on load rather than
# on a defect, and would do it once a day at seven in the morning.
app.notifications.deadline.enabled=false
# Small, so the paging test does not have to create five hundred tasks.
app.notifications.deadline.batch-size=2

# Reports. Small bounds so the tests that prove the bounds exist do not have to
# build a year of data to reach them. The page cap stays above the endpoints'
# own default page size of twenty, or every request that named no size at all
# would be refused by the cap meant for the ones that name a large one.
app.reports.default-period-days=30
app.reports.max-period-days=40
app.reports.max-page-size=25
app.reports.upcoming-lead-days=7

# Admin panel. Small bounds for the same reason the report bounds are small:
# the tests that prove a bound exists have to be able to reach it.
#
# The page cap stays above the LARGEST endpoint default, which here is the audit
# trail's fifty rather than the twenty the two listings use. Set below it, every
# request that named no size at all would be refused by the cap meant for the
# ones that name a large one. That is the same trap the reports block above
# records, and this is the second time it has been walked into: the reports cap
# only had to clear twenty.
app.admin.stats-window-days=30
app.admin.max-stats-window-days=40
app.admin.max-page-size=60
