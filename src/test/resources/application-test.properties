# Integration tests get their datasource from the PostgreSQL container via
# @ServiceConnection. These values only satisfy the placeholders in
# application.properties so the context can start; they are overridden.
spring.datasource.url=jdbc:postgresql://localhost:5432/placeholder
spring.datasource.username=placeholder
spring.datasource.password=placeholder

spring.flyway.clean-disabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN

# Fixed key so a token minted in one test can be read in another.
app.security.jwt.secret=test-only-signing-key-thirty-two-bytes-minimum
app.security.cookie.secure=false
app.mail.log-tokens=true

# Short enough that a lockout test does not have to wait, long enough that it
# does not expire mid-test.
app.security.lockout.max-attempts=5
app.security.lockout.duration=15m

# Attachments are written under the build directory, so the suite leaves
# nothing behind outside target/ and a clean build starts from empty.
app.storage.provider=LOCAL
app.storage.local-directory=./target/test-attachments
# Small enough that the oversize test does not have to build ten megabytes.
app.storage.max-file-size=1MB
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB
