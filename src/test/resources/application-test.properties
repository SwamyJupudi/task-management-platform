# Integration tests get their datasource from the PostgreSQL container via
# @ServiceConnection. These values only satisfy the placeholders in
# application.properties so the context can start; they are overridden.
spring.datasource.url=jdbc:postgresql://localhost:5432/placeholder
spring.datasource.username=placeholder
spring.datasource.password=placeholder

spring.flyway.clean-disabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

logging.level.org.testcontainers=WARN
logging.level.com.github.dockerjava=WARN
