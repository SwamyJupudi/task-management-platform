# The demo profile: one free Render web service, one free Postgres, nothing else.
#
# WHAT THIS IS FOR, AND WHAT IT IS NOT
#
# A public, disposable demonstration of the product on infrastructure that costs
# nothing. It is NOT production and must never be pointed at real data. Read the
# relaxations below before using it for anything else.
#
# WHY A PROFILE RATHER THAN A FLAG
#
# Three configurations refuse to start under `prod`, each for a good reason:
# local attachment storage, a mail transport that only logs, and a disabled
# malware scanner. Every one of those guards tests for the `prod` profile alone,
# so this file relaxes them by not being that profile. Nothing in the guards
# changed, prod is untouched, and there is no flag anybody can set in production
# to switch a control off.
#
# THE RELAXATIONS, STATED PLAINLY
#
#   Uploads are NOT scanned.        MALWARE_SCAN_PROVIDER defaults to DISABLED
#                                   here, so every file is recorded clean
#                                   without being inspected. Do not upload
#                                   anything you did not create.
#   Attachments are EPHEMERAL.      They are written to the container's disk,
#                                   which Render discards on every deploy and
#                                   whenever a free instance spins down.
#   Rate limiting is not enforced.  There is no Redis, so the limiter fails open
#                                   exactly as it is designed to.
#
# Mail is NOT switched off. It goes over a provider's HTTP API -- an ordinary
# HTTPS call, which a platform that restricts outbound mail ports cannot get in
# the way of. Set MAIL_HTTP_API_KEY and it delivers; leave it unset and links are
# written to the log instead, which still completes a verification or an
# invitation by copy and paste. Without one of those two, the only account that
# can sign in is the bootstrap administrator.

# --- Everything below is production's behaviour, kept ---------------------
# Structured JSON on stdout, so Render's log viewer can be searched the same way
# a collector would search production.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=demo
logging.level.root=INFO
logging.level.org.springframework.web=WARN

# The API console is ON here and off in production, which is the one place this
# profile is deliberately more open: a demo of an API is easier to show with it.
springdoc.swagger-ui.enabled=${OPENAPI_ENABLED:true}
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}

# Health only, and no details. A public URL should not publish which component
# is unhealthy.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Render terminates TLS in front of this process, so the scheme, host and client
# address all arrive in forwarded headers. Without this the application would
# build http:// links behind an https:// origin and see the proxy's address as
# every caller's.
server.forward-headers-strategy=framework

# In-flight requests finish before the process exits, which matters on a
# platform that redeploys by replacing the container.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_GRACE_PERIOD:30s}

# --- The relaxations, each defaulted rather than inherited ----------------
# Defaulted for the same reason production defaults them the other way: a value
# inherited from the base file is a value nobody chose.
app.storage.provider=${STORAGE_PROVIDER:LOCAL}
app.storage.local-directory=${STORAGE_LOCAL_DIR:/tmp/attachments}

# DISABLED reports every uploaded file clean without inspecting it. It is
# refused under prod and it is the only way to run this without a scanner
# alongside, which no free tier provides.
app.malware-scan.provider=${MALWARE_SCAN_PROVIDER:DISABLED}

# Mail goes over a provider's HTTP API here, not SMTP. Setting MAIL_HTTP_API_KEY is
# enough on its own: DemoMailConfig contributes that transport as the primary
# MailSender whenever a key is present, which is the extension point MailConfig
# always advertised. So LOG is the right default for this setting, because what it
# selects is MailConfig's own fallback for when no key is configured -- and LOG is
# refused under prod and permitted here, which is the whole reason this profile
# exists.
#
# MAIL_PROVIDER=HTTP asks for the same transport by name rather than by profile. It
# is a valid choice anywhere, including prod, and it requires MAIL_HTTP_API_KEY and
# MAIL_FROM: asking for HTTP is asking for delivery, so a missing key is refused at
# startup rather than quietly downgraded to the log.
app.mail.provider=${MAIL_PROVIDER:LOG}

# The provider. MAIL_HTTP_API_KEY is a credential: it comes from the environment,
# it is never written here, and neither the sender nor the provider's response
# body is ever logged.
#
# The default URL is Resend's, whose free tier is enough for a demonstration and
# whose body shape HttpMailSender writes. A provider accepting the same shape can
# be pointed at by setting MAIL_HTTP_URL alone.
app.mail.http.url=${MAIL_HTTP_URL:https://api.resend.com/emails}
app.mail.http.api-key=${MAIL_HTTP_API_KEY:}

# Tokens ARE written to the log here, and only here. Without an API key this is
# the only way to complete a verification or an invitation -- copy the link out of
# the Render log -- and a disposable demonstration on a database nobody cares
# about is the one place that trade is acceptable. It is false everywhere else,
# and prod cannot reach this file.
app.mail.log-tokens=${MAIL_LOG_TOKENS:true}

# Email verification is NOT required to sign in here. It is required everywhere
# else, and this is the one profile that says otherwise.
#
# WHY. A disposable demonstration may have no mail transport at all: without
# MAIL_HTTP_API_KEY the links are written to the log, and a provider's free tier
# commonly refuses to deliver to any address but the account owner's. Either way
# somebody registers, is told the account exists, and is then refused the sign-in
# that follows -- with the confirmation link somewhere they are not looking.
#
# WHAT THIS DOES NOT DO. It does not switch verification off. The token is still
# issued, the message is still sent, /auth/verify-email still confirms an address
# and the account is still reported unverified until it does. The single thing
# that changes is whether an unconfirmed address may sign in.
app.security.require-email-verification=${REQUIRE_EMAIL_VERIFICATION:false}

# --- Sized for a free instance -------------------------------------------
# 512MB of memory and a Postgres plan with few connections. The defaults are
# sized for a production host and would reserve more of both than this has.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
