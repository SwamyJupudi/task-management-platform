# Production. Every datasource value is inherited from application.properties
# and therefore required in the environment. Startup fails if any is missing.

# Structured JSON on stdout so a log collector can parse and search it.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=production
logging.level.root=INFO
logging.level.org.springframework.web=WARN

# The API contract is generated but the interactive console is not served.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}

# Only health is exposed publicly, and without internal detail.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Behind a load balancer or ingress that terminates TLS.
server.forward-headers-strategy=framework

# Graceful shutdown, with the bound that makes it mean something. On SIGTERM
# the connector stops accepting and in-flight requests are given this long to
# finish; after it they are cut off and the process exits anyway. Without the
# timeout the phase has no limit, so one stuck request could hold a rolling
# deployment open until the orchestrator lost patience and sent SIGKILL, which
# is the ungraceful shutdown this setting exists to avoid.
#
# Keep it below the orchestrator's own termination grace period, or the
# platform kills the process before this expires and the setting does nothing.
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=${SHUTDOWN_GRACE_PERIOD:30s}

# Attachments live in object storage here, never on the application server.
# Defaulted rather than inherited: the base file defaults to LOCAL for
# development, and a production deployment that forgot to set STORAGE_PROVIDER
# would otherwise inherit it and be refused at startup for the wrong reason.
#
# The bucket and the region have no defaults on purpose. StorageConfig refuses
# to start without them and names the variable that is missing, which is a
# clearer failure than an SDK error on the first upload.
app.storage.provider=${STORAGE_PROVIDER:S3}

# Uploads are scanned here, and the application refuses to start if they cannot
# be. Defaulted rather than inherited for the same reason the storage provider
# is: the base file defaults to DISABLED for development, and a production
# deployment that forgot to set MALWARE_SCAN_PROVIDER would otherwise inherit it
# and be refused at startup for the wrong reason.
#
# MALWARE_SCAN_URL has no default on purpose. MalwareScanConfig refuses to start
# without it and names the variable that is missing, which is clearer than a
# failure on the first upload.
#
# WHAT THIS COSTS: the scanner is a hard startup dependency here. Bring it up
# before the application, and expect a restart during a scanner outage to leave
# instances unable to come back until it returns. That is what failing closed
# means; there is deliberately no flag to relax it.
app.malware-scan.provider=${MALWARE_SCAN_PROVIDER:HTTP}
