# Production. Every datasource value is inherited from application.properties
# and therefore required in the environment. Startup fails if any is missing.

# Structured JSON on stdout so a log collector can parse and search it.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.environment=production
logging.level.root=INFO
logging.level.org.springframework.web=WARN

# The API contract is generated but the interactive console is not served.
springdoc.swagger-ui.enabled=false
springdoc.api-docs.enabled=${OPENAPI_ENABLED:true}

# Only health is exposed publicly, and without internal detail.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Behind a load balancer or ingress that terminates TLS.
server.forward-headers-strategy=framework
server.shutdown=graceful

# Attachments live in object storage here, never on the application server.
# Defaulted rather than inherited: the base file defaults to LOCAL for
# development, and a production deployment that forgot to set STORAGE_PROVIDER
# would otherwise inherit it and be refused at startup for the wrong reason.
#
# The bucket and the region have no defaults on purpose. StorageConfig refuses
# to start without them and names the variable that is missing, which is a
# clearer failure than an SDK error on the first upload.
app.storage.provider=${STORAGE_PROVIDER:S3}
