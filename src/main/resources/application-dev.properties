# Local development. Defaults match docker-compose.yml so a fresh clone
# runs after `docker compose up -d` with no further configuration.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanagement}
spring.datasource.username=${DB_USERNAME:taskmanagement}
spring.datasource.password=${DB_PASSWORD:taskmanagement}

logging.level.com.company.taskmanagementplatform=DEBUG
logging.level.org.flywaydb=DEBUG

management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.show-details=always

springdoc.swagger-ui.enabled=true

# Development only. There is no mail transport, so the verification and reset
# links are written to the log instead. This is the one place tokens are logged
# and it must never be switched on anywhere real.
app.mail.log-tokens=true

# Local development is plain HTTP, so a Secure cookie would never be stored.
app.security.cookie.secure=false

# Development-only signing key. Production supplies its own and startup fails
# without it.
app.security.jwt.secret=${JWT_SECRET:dev-only-signing-key-not-for-any-real-environment}
