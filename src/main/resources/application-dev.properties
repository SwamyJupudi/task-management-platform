# Local development. Defaults match docker-compose.yml so a fresh clone
# runs after `docker compose up -d` with no further configuration.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/taskmanagement}
spring.datasource.username=${DB_USERNAME:taskmanagement}
spring.datasource.password=${DB_PASSWORD:taskmanagement}

logging.level.com.company.taskmanagementplatform=DEBUG
logging.level.org.flywaydb=DEBUG

management.endpoints.web.exposure.include=health,info,flyway
management.endpoint.health.show-details=always

springdoc.swagger-ui.enabled=true
