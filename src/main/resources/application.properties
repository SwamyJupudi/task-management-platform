spring.application.name=task-management-platform

# No default profile on purpose. The application must be told which
# environment it is running in, so a missing profile fails loudly rather
# than silently starting with development settings.

# --- Datasource ---------------------------------------------------------
# Every value comes from the environment. Nothing is hardcoded here.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.pool-name=tmp-pool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}

# --- JPA ----------------------------------------------------------------
# Flyway owns the schema. Hibernate must never create or alter it.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# --- Flyway -------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# --- Web ----------------------------------------------------------------
server.port=${SERVER_PORT:8080}
# Internal error detail must never reach the client. The global exception
# handler produces the user-facing body instead.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
spring.mvc.problemdetails.enabled=false

# --- Response compression -----------------------------------------------
# On in every environment. The API's own payloads are JSON, which compresses
# well enough that the CPU is cheaper than the bytes on any link a person is
# actually using.
#
# The type list is an allowlist, and what it leaves out is the point. An
# attachment download streams the stored bytes, and images, PDFs and ZIPs are
# already compressed: running them through gzip spends CPU to make them very
# slightly larger. Only the text-shaped types are listed.
#
# Below the threshold a response is sent as-is. Compressing a two-hundred-byte
# error body costs a header, a trailer and a CPU cycle to save nothing.
server.compression.enabled=${RESPONSE_COMPRESSION_ENABLED:true}
server.compression.mime-types=application/json,application/xml,text/plain,text/css,text/html,text/xml,application/javascript
server.compression.min-response-size=${RESPONSE_COMPRESSION_MIN_SIZE:1KB}

# --- Container sizing ---------------------------------------------------
# Deliberately below Tomcat's own default of 200 threads, and the reason is the
# connection pool above rather than the CPU. A request that touches the
# database needs one of DB_POOL_MAX_SIZE connections, so threads far in excess
# of the pool do not add throughput: they add requests queued inside the
# application, holding a thread and a socket, where a shorter queue would have
# applied backpressure at the front door instead. Raise this and the pool
# together or neither.
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:100}
server.tomcat.threads.min-spare=${TOMCAT_MIN_SPARE_THREADS:10}
# Connections, not threads. A kept-alive connection with no request in flight
# costs a socket and no thread, so this is much larger than the thread count.
server.tomcat.max-connections=${TOMCAT_MAX_CONNECTIONS:8192}
# The backlog once every connection is taken. Beyond it the kernel refuses,
# which a client sees as a connection failure rather than as a request that
# hangs for a minute and then fails anyway.
server.tomcat.accept-count=${TOMCAT_ACCEPT_COUNT:100}
server.tomcat.connection-timeout=${TOMCAT_CONNECTION_TIMEOUT:20s}
server.tomcat.keep-alive-timeout=${TOMCAT_KEEP_ALIVE_TIMEOUT:20s}
server.tomcat.max-keep-alive-requests=${TOMCAT_MAX_KEEP_ALIVE_REQUESTS:100}

# --- Actuator -----------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.access=read-only
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.info.env.enabled=false

# --- OpenAPI ------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.disable-swagger-default-url=true

# --- Logging ------------------------------------------------------------
logging.level.root=INFO
logging.level.com.company.taskmanagementplatform=INFO

# --- Security -----------------------------------------------------------
# The signing secret is required and has no default. HS256 needs at least 32
# bytes; startup fails if it is shorter, rather than running on a weak key.
app.security.jwt.issuer=${JWT_ISSUER:task-management-platform}
app.security.jwt.audience=${JWT_AUDIENCE:task-management-platform-api}
app.security.jwt.secret=${JWT_SECRET}
app.security.jwt.access-ttl=${JWT_ACCESS_TTL:15m}

# The refresh token travels in this cookie. Path-scoped to the authentication
# endpoints so a long-lived credential is not attached to every request.
app.security.cookie.name=refresh_token
app.security.cookie.path=${app.api.base-path}/auth
app.security.cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.security.cookie.ttl=${JWT_REFRESH_TTL:14d}

# No composition rules: the requirements ask for none. The upper bound is not a
# style choice, it is the point past which BCrypt ignores input.
app.security.password.min-length=8
app.security.password.max-bytes=72

app.security.lockout.max-attempts=${LOCKOUT_MAX_ATTEMPTS:5}
app.security.lockout.duration=${LOCKOUT_DURATION:15m}

app.security.tokens.email-verification-ttl=24h
app.security.tokens.password-reset-ttl=1h
app.security.tokens.invitation-ttl=7d

# --- Mail ---------------------------------------------------------------
# LOG writes messages to the log and delivers nothing, which is what development
# and the tests want and what the prod profile REFUSES TO START with: an
# installation that cannot deliver a verification link cannot onboard anybody,
# and it fails silently. Set MAIL_PROVIDER=SMTP in any real environment.
app.mail.provider=${MAIL_PROVIDER:LOG}

# The envelope sender, required when the provider is SMTP and checked at startup.
# Most providers reject a message whose sender they do not recognise.
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:}

app.mail.link-base-url=${MAIL_LINK_BASE_URL:http://localhost:5173}
app.mail.log-tokens=false

# The transport itself, bound by Spring Boot. A JavaMailSender is only created
# when a host is set, so development and the tests leave SMTP_HOST empty and get
# none; MailConfig turns the absence into a clear startup failure rather than an
# unsatisfied dependency.
#
# The credentials are a secret like any other and come from the environment. They
# are never written here and never committed.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
# STARTTLS on the submission port, which is what 587 is for. A provider that
# wants implicit TLS on 465 needs SMTP_PORT=465 and ssl.enable instead.
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
# Bounded, because this runs on the listener thread after a commit: a mail server
# that accepts a connection and then stalls would otherwise hold it indefinitely.
spring.mail.properties.mail.smtp.connectiontimeout=${SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.timeout=${SMTP_TIMEOUT:10000}
spring.mail.properties.mail.smtp.writetimeout=${SMTP_TIMEOUT:10000}

# The mail health indicator is OFF, for the same reason the Redis one is, and it
# is not optional here. The starter registers an indicator that opens a
# connection to the mail server on every health check. Two consequences, both
# bad: with no host configured -- development, and the whole test suite -- the
# check fails and /actuator/health answers 503 although the application is
# perfectly able to serve requests; and in production it would let a mail
# provider's outage pull a healthy instance out of the load balancer. Delivery
# here is asynchronous and already degrades by logging the failure, so a mail
# server being unreachable is not this application being unhealthy.
management.health.mail.enabled=false

# --- Uploads and attachment storage -------------------------------------
# Two limits, on purpose. The container refuses an oversized upload before a
# body is read, which is the cheap defence; the application checks again once
# it has the bytes, which is the one that can phrase a useful message. Both
# answer 413.
spring.servlet.multipart.max-file-size=${ATTACHMENT_MAX_SIZE:10MB}
spring.servlet.multipart.max-request-size=${ATTACHMENT_MAX_REQUEST_SIZE:12MB}

# LOCAL keeps files on this machine and is refused at startup in production,
# where the requirements say attachments belong in object storage. The prod
# profile defaults this to S3; the default here is what development and tests
# get.
app.storage.provider=${STORAGE_PROVIDER:LOCAL}
app.storage.local-directory=${STORAGE_LOCAL_DIR:./var/attachments}
app.storage.max-file-size=${ATTACHMENT_MAX_SIZE:10MB}
# How long a presigned download URL lasts. A security setting: the URL carries
# its own authorization, so this is how long a leaked one keeps working.
app.storage.download-url-ttl=${ATTACHMENT_URL_TTL:5m}

# Object storage. Required when the provider is S3, and checked at startup so a
# missing one fails the deployment rather than the first upload.
#
# There is deliberately no key or secret here. The SDK's default credential
# chain reads a container or instance role first and the environment after, so
# a deployment grants access through a role and rotates nothing by hand.
app.storage.bucket=${STORAGE_BUCKET:}
app.storage.region=${STORAGE_REGION:}
# An alternative S3 endpoint, for MinIO, R2 or Spaces. Empty means Amazon.
app.storage.endpoint=${STORAGE_ENDPOINT:}
# Addresses the bucket as a path rather than a subdomain. Every S3-compatible
# server but Amazon's own wants this.
app.storage.path-style-access=${STORAGE_PATH_STYLE:false}

# --- Malware scanning ---------------------------------------------------
# DISABLED reports every uploaded file clean WITHOUT INSPECTING IT, and is
# refused at startup under the prod profile for the same reason LOCAL storage
# is: a quiet fallback is how the rule gets broken.
#
# HTTP posts the bytes to MALWARE_SCAN_URL and reads the verdict from the status
# code: 200 is clean, 422 is infected with the first line of the body as the
# signature, anything else is an error and the upload is refused. That contract
# is deliberately small enough for any engine to be fronted with a shim, which
# is what keeps this provider-agnostic without naming a product. The whole
# contract is written out on HttpMalwareScanner.
#
# FAIL CLOSED. Under prod the scanner is probed at startup and the application
# refuses to start if it does not answer; once running, a scan that cannot be
# completed refuses the upload with 503 rather than accepting it unscanned.
app.malware-scan.provider=${MALWARE_SCAN_PROVIDER:DISABLED}
app.malware-scan.url=${MALWARE_SCAN_URL:}
# Paid inside the upload request, so this is how long a user waits on a slow
# scanner before being told to try again.
app.malware-scan.timeout=${MALWARE_SCAN_TIMEOUT:10s}

# --- Notifications ------------------------------------------------------
# The deadline scan, which is the only scheduled job in the platform. Daily
# rather than hourly: an approaching deadline is a once-a-day fact, and the
# unique index would throw away twenty-three of twenty-four hourly attempts.
# One instance runs it at a time, decided by a PostgreSQL advisory lock.
app.notifications.deadline.enabled=${DEADLINE_SCAN_ENABLED:true}
app.notifications.deadline.cron=${DEADLINE_SCAN_CRON:0 0 7 * * *}
# How many days ahead counts as approaching.
app.notifications.deadline.lead-days=${DEADLINE_LEAD_DAYS:2}
# Tasks read per page. The scan is the one query whose size grows with the
# whole estate rather than with one workspace.
app.notifications.deadline.batch-size=500

# --- Scheduled cleanup --------------------------------------------------
# Two purges, and BOTH ARE OFF BY DEFAULT. That is the opposite of the
# deadline scan above, and deliberately so: the scan sends a message, these
# delete data. A deployment opts into destruction rather than discovering it
# has been running.
#
# Each takes the same advisory lock mechanism the scan uses, so only one
# instance runs each of them. The hours are staggered rather than shared: the
# three jobs contend for nothing, but a night on which all three start at once
# is a harder one to read a log from.

# Expired verification, reset, invitation and refresh tokens. Retention is
# counted from EXPIRY, not from issue: an expired token is already refused by
# every lookup, so the window only buys the ability to answer a question asked
# a few days late from the data rather than from the logs.
app.auth.token-purge.enabled=${TOKEN_PURGE_ENABLED:false}
app.auth.token-purge.cron=${TOKEN_PURGE_CRON:0 30 3 * * *}
app.auth.token-purge.retention=${TOKEN_PURGE_RETENTION:30d}
# Rows per statement. Bounded because the first run after this is switched on
# has the whole history to remove, and one unbounded DELETE would hold locks on
# the busiest tables in the schema for as long as that took.
app.auth.token-purge.batch-size=${TOKEN_PURGE_BATCH_SIZE:500}

# The stored bytes behind soft-deleted attachments. This is the retention that
# decides whether a file deleted by mistake can still be recovered: until the
# purge takes it the row is marked and the object is intact. Shortening it
# shortens that window.
app.storage.purge.enabled=${ATTACHMENT_PURGE_ENABLED:false}
app.storage.purge.cron=${ATTACHMENT_PURGE_CRON:0 15 4 * * *}
app.storage.purge.retention=${ATTACHMENT_PURGE_RETENTION:30d}
# Attachments per batch. Each one costs a call to the object store, so this
# bounds a batch's wall-clock rather than a statement's cost.
app.storage.purge.batch-size=${ATTACHMENT_PURGE_BATCH_SIZE:200}

# The unscanned backlog. V12 records every attachment that predates malware
# scanning as PENDING rather than pretending it was scanned, so on an existing
# installation those files stop being downloadable until something has actually
# looked at them. THIS IS THE JOB THAT CLEARS THEM, and without it the migration
# is a one-way door. A file becomes downloadable when a scanner passes it and not
# before; there is no shortcut that marks the backlog clean.
#
# Off by default like the purges, though it destroys nothing: it reads every
# unscanned file out of object storage and sends it to the scanner, which on a
# large backlog is a lot of egress and scanner load arriving the moment a
# deployment restarts. Hourly rather than nightly, because a backlog is something
# an operator is waiting on.
app.storage.rescan.enabled=${ATTACHMENT_RESCAN_ENABLED:false}
app.storage.rescan.cron=${ATTACHMENT_RESCAN_CRON:0 20 * * * *}
# Small: each file is read whole into memory and sent to the scanner, so this
# bounds one run's memory and wall-clock rather than a statement's cost.
app.storage.rescan.batch-size=${ATTACHMENT_RESCAN_BATCH_SIZE:50}

# Spring's default scheduler is a single thread, which would queue the deadline
# scan behind a purge that ran long. Two, so one slow job cannot postpone
# another; there are three jobs but they run at different hours, so two threads
# is slack rather than parallelism.
spring.task.scheduling.pool-size=${SCHEDULER_POOL_SIZE:2}

# --- Redis and rate limiting --------------------------------------------
# Redis is here for the rate limiter's counters and for NOTHING ELSE. Caching
# is not switched on: there is no @EnableCaching and no CacheManager anywhere,
# which is how the standing decision that a resolved permission set must not be
# cached is enforced by the absence of the machinery rather than by review. A
# membership change, a role change and a deactivation all have to take effect
# on the next request, and PermissionResolver's own contract says so.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.database=${REDIS_DATABASE:0}
spring.data.redis.ssl.enabled=${REDIS_SSL:false}
# SHORT ON PURPOSE, and this is the setting that makes failing open actually
# work. The limiter allows the request through when Redis cannot be reached, so
# the cost of an unreachable Redis is whatever these timeouts are, added to
# every request until the backoff below kicks in. A default multi-second
# timeout would honour the fail-open and still make the application unusable.
spring.data.redis.timeout=${REDIS_TIMEOUT:250ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:250ms}

# The Redis health indicator is OFF, deliberately. Redis unavailable is not an
# outage here: the limiter fails open and every request is served. A dependency
# the application is designed to degrade past must not be able to fail a
# readiness probe and have a healthy instance pulled out of the load balancer.
management.health.redis.enabled=false

# Rate limiting. On by default. Off is for a deployment that puts its limits at
# a gateway in front of the application instead, which is the other reasonable
# place for them.
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
# How long the limiter stops consulting Redis after a failure, so an outage
# costs one timeout rather than one per request.
app.rate-limit.unavailable-backoff=${RATE_LIMIT_UNAVAILABLE_BACKOFF:30s}

# Per caller address. The global figure is a backstop against one caller
# saturating the container's threads, not a per-endpoint limit; the auth figure
# covers the unauthenticated endpoints, which are the ones worth attacking.
app.rate-limit.requests-per-minute=${RATE_LIMIT_REQUESTS_PER_MINUTE:300}
app.rate-limit.auth-requests-per-minute=${RATE_LIMIT_AUTH_REQUESTS_PER_MINUTE:20}
app.rate-limit.registrations-per-hour=${RATE_LIMIT_REGISTRATIONS_PER_HOUR:5}

# Per account, keyed by a hash of the address so no address is ever written to
# Redis. LOOSER THAN THE ACCOUNT LOCKOUT ON PURPOSE: the lockout is five
# attempts and this is ten, so the lockout always fires first and somebody who
# mistyped their password is told their account is locked rather than told to
# come back later. Set this at or below the lockout and that behaviour changes.
app.rate-limit.login-attempts-per-account=${RATE_LIMIT_LOGIN_PER_ACCOUNT:10}
# The other half of the registration-enumeration condition in architecture.md:
# by address above, by the account named here.
app.rate-limit.registrations-per-account=${RATE_LIMIT_REGISTRATIONS_PER_ACCOUNT:3}
# Reset and resend both send mail to somebody who may not have asked for it.
app.rate-limit.recovery-requests-per-account=${RATE_LIMIT_RECOVERY_PER_ACCOUNT:5}

# --- Reports and dashboards ---------------------------------------------
# Nothing in this phase is cached, so every figure is computed at request time
# over whatever range the caller names. These are the bounds on what one
# request may ask for, which is the requirements' instruction about not
# fetching records unnecessarily applied to a range rather than to a page.
app.reports.default-period-days=${REPORT_DEFAULT_PERIOD_DAYS:30}
# A year and a day, so "the last twelve months" inclusive of both ends is not
# refused by one.
app.reports.max-period-days=${REPORT_MAX_PERIOD_DAYS:366}
# How far ahead the employee dashboard looks for deadlines. Deliberately not
# app.notifications.deadline.lead-days, which is two: a notification is a nudge
# about something imminent, a dashboard is a week's planning.
app.reports.upcoming-lead-days=${REPORT_UPCOMING_LEAD_DAYS:7}
# The cap on a report listing. A larger page is refused rather than silently
# clamped, because a clamped page makes a client's paging arithmetic wrong.
app.reports.max-page-size=${REPORT_MAX_PAGE_SIZE:100}

# --- Admin panel --------------------------------------------------------
# The admin panel is the only part of the platform whose queries have no
# workspace predicate, so the instruction about not fetching records
# unnecessarily bites harder here than anywhere else. These are the bounds.
# The trailing window the "recent" figures use when a request names none.
app.admin.stats-window-days=${ADMIN_STATS_WINDOW_DAYS:30}
# The widest window accepted. A year and a day, matching the report cap, so the
# two administrative surfaces do not disagree about what is too far back.
app.admin.max-stats-window-days=${ADMIN_MAX_STATS_WINDOW_DAYS:366}
# The cap on an admin listing. A larger page is refused rather than clamped, so
# a client's own paging arithmetic cannot quietly go wrong.
app.admin.max-page-size=${ADMIN_MAX_PAGE_SIZE:100}

# --- Bootstrap ----------------------------------------------------------
# Creates the first platform administrator when there is not one. Set both or
# neither; half of the pair fails startup. Never committed.
app.bootstrap.super-admin-email=${SUPER_ADMIN_EMAIL:}
app.bootstrap.super-admin-password=${SUPER_ADMIN_PASSWORD:}

# --- Application --------------------------------------------------------
app.api.base-path=/api/v1
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
app.cors.allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
app.cors.allowed-headers=Authorization,Content-Type,X-Request-Id
app.cors.exposed-headers=X-Request-Id
app.cors.allow-credentials=true
app.cors.max-age-seconds=3600
