# Local development dependencies only. Not a deployment artifact.
services:
  postgres:
    image: postgres:16-alpine
    container_name: tmp-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-taskmanagement}
      POSTGRES_USER: ${DB_USERNAME:-taskmanagement}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-taskmanagement}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-taskmanagement} -d ${DB_NAME:-taskmanagement}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
